name: lint

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.14.0
